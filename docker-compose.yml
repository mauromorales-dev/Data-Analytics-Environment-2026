version: '3.8'

networks:
  data-network:
    driver: bridge

services:
  # 1. EL MOTOR DE BASE DE DATOS: POSTGRESQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: mauro_analyst
      POSTGRES_PASSWORD: "MauroPostgresData2026!"
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-network
    restart: unless-stopped

  # 2. CAPA DE TRANSFORMACIÓN: dbt
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt
    ports:
      - "3001:80"
      - "8000:8000"
    volumes:
      - dbt-code:/usr/app/dbt
      - /home/mauro-dev/Documents/projects_dbt:/usr/app/dbt_projects
    working_dir: /usr/app/dbt/my_project
    networks:
      - data-network
    depends_on:
      postgres:
        condition: service_started

  # 3. NUEVA CAPA DE VISUALIZACIÓN: Metabase (Reemplaza a Superset)
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000" # 👈 Acceso local en http://localhost:3000
    volumes:
      - metabase-data:/metabase-data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db # Guarda tu progreso localmente
    networks:
      - data-network
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  # 4. ADMINISTRADOR WEB: pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mauromorales.tech
      - PGADMIN_DEFAULT_PASSWORD=MauroPgadmin2026!
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - data-network
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
    external: false
  dbt-code:
    external: false
  metabase-data: # El nuevo volumen para tus dashboards de Metabase
    external: false
  pgadmin-data:
    external: false
